name: Build signed Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/fluxmedia/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/fluxmedia/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GitHub's ubuntu-latest image already includes the Android SDK and
      # ANDROID_HOME. Do not use android-actions/setup-android@v3: it tries
      # to install the removed "tools" package and fails.

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUXMEDIA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "FLUXMEDIA_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "Using release keystore."
          else
            echo "::warning::No FLUXMEDIA_KEYSTORE_BASE64 secret; the release APK will be signed with the debug key."
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build signed release APK
        working-directory: android
        env:
          FLUXMEDIA_KEYSTORE_PASSWORD: ${{ secrets.FLUXMEDIA_KEYSTORE_PASSWORD }}
          FLUXMEDIA_KEY_ALIAS: ${{ secrets.FLUXMEDIA_KEY_ALIAS }}
          FLUXMEDIA_KEY_PASSWORD: ${{ secrets.FLUXMEDIA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: fluxmedia-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
